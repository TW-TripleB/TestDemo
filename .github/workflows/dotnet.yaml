name: Run Tests

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Go into solution folder
      run: cd TestDemo

    - name: Restore dependencies
      run: dotnet restore TestDemo.sln

    - name: Build solution
      run: dotnet build TestDemo.sln --no-restore

    - name: Run tests
      run: dotnet test TestDemo.sln --no-build --verbosity normal
